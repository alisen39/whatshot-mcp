[server]
bind = "127.0.0.1"
port = 6691
path = "/mcp"
# When a TLS reverse proxy preserves a public Host header, list it explicitly.
# Loopback hosts remain allowed automatically.
allowed_hosts = []
allowed_origins = []

[server.auth]
# "none" is allowed only on loopback. Use "bearer_passthrough" for a
# non-loopback bind. It requires each client to send its own wh_live_ key as
# Authorization: Bearer <key>. "oauth" is reserved and currently fails closed.
mode = "none"

[backend]
url = "http://127.0.0.1:6690/api/v1"
# A static Backend key is only for loopback development and operational checks.
# Do not configure it when server.auth.mode="bearer_passthrough": hosted calls
# use the request-scoped client key instead. The environment value takes
# precedence when present.
# api_key = "replace-me"
api_key_env = "WHATSHOT_MCP_BACKEND_API_KEY"
timeout_seconds = 15
capabilities_ttl_seconds = 60

[tools]
max_result_items = 200
default_history_days = 7
max_analysis_scan_items = 2000
