[server]
bind = "127.0.0.1"
port = 6691
path = "/mcp"

[server.auth]
# "none" is allowed only on loopback. Use "static_token" for a non-loopback
# bind and provide the token through token_env. "oauth" is reserved and
# currently fails closed.
mode = "none"
token_env = "WHATSHOT_MCP_SERVER_TOKEN"

[backend]
url = "http://127.0.0.1:6690/api/v1"
# For a local private config file, an API key may be set directly. Do not commit
# the real value. The environment variable below takes precedence when present.
# api_key = "replace-me"
api_key_env = "WHATSHOT_MCP_BACKEND_API_KEY"
timeout_seconds = 15
capabilities_ttl_seconds = 60

[tools]
max_result_items = 200
default_history_days = 7
max_analysis_scan_items = 2000
