name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a new MCP SDK release is tested even without a commit here.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m whatshot_mcp.contracts.export --check
      - run: uv run pytest -q
      - run: uv build

  latest-deps:
    # PyPI installs resolve the newest allowed versions, not uv.lock. MCP SDK
    # 2.3 hid tool error text from 0.4.1 while the locked 2.0 tests passed.
    name: Latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --upgrade --all-groups
      - run: uv pip list | grep -E '^(mcp|mcp-types|pydantic|httpx|starlette) '
      - run: uv run pytest -q

  package-boundary:
    name: Package boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv build
      - name: Reject private backend or database code in wheel
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          forbidden = ("pj_07/", "whats_hot_api/", "duckdb", "sqlalchemy", "asyncpg")
          found = [name for name in names if any(part in name for part in forbidden)]
          if found:
              raise SystemExit(f"forbidden package content: {found}")
          PY
