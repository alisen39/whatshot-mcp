[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "whatshot-mcp"
version = "0.3.1"
description = "Open MCP server and backend contract models for WhatsHot"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "alisen39" }]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "httpx[http2]>=0.28.1,<1",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "uvicorn>=0.38,<1",
]

[project.urls]
Homepage = "https://github.com/alisen39/whatshot-mcp"
Repository = "https://github.com/alisen39/whatshot-mcp"
Issues = "https://github.com/alisen39/whatshot-mcp/issues"

[project.scripts]
whatshot-mcp = "whatshot_mcp.cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whatshot_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/config.example.toml",
    "/contracts",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B009", "E501", "UP046"]
